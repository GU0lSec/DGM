<header class="page-header">
  <h1>Get in Touch</h1>
  <p>Ready to grow your digital presence? Send us a message.</p>
</header>

<!-- Dedicated Form Container -->
<main class="contact-container">
  <form class="contact-form">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required placeholder="John Doe">
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required placeholder="john@example.com">
    </div>

    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required placeholder="Tell us about your project..."></textarea>
    </div>

    <button type="submit" class="cta-button submit-btn">Send Message</button>
  </form>
</main>
